name: Build Unix binaries

on:
  workflow_dispatch:
    inputs:
      version:
        description: Version label (letters, digits, dot, underscore, plus, hyphen)
        required: true
        default: devel
        type: string

permissions:
  contents: read

jobs:
  build:
    name: ${{ matrix.goos }}/${{ matrix.goarch }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        goos: [linux, darwin]
        goarch: [amd64, arm64]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: '1.26.x'
          cache: false
      - name: Build
        env:
          CGO_ENABLED: '0'
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          VERSION: ${{ inputs.version }}
        run: |
          case "$VERSION" in
            ''|*[!A-Za-z0-9._+-]*)
              printf '%s\n' 'Invalid version label' >&2
              exit 1
              ;;
          esac
          go build -trimpath -buildvcs=false -ldflags "-X main.version=$VERSION" -o dist/trysudo .
          tar -czf dist/trysudo.tar.gz -C dist trysudo
      - uses: actions/upload-artifact@v7
        with:
          name: trysudo-${{ matrix.goos }}-${{ matrix.goarch }}
          path: dist/trysudo.tar.gz
          if-no-files-found: error
